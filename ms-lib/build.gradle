plugins {
    id 'org.springframework.boot' version '2.3.9.RELEASE'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java-library'
}

group 'com.c2.lc.lib'
version = '1.0.0'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-mail:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-security:2.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation group: 'io.projectreactor.netty', name: 'reactor-netty', version: '1.0.9'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.junit.jupiter:junit-jupiter:5.5.0'
    implementation 'org.projectreactor:reactor-spring:1.0.1.RELEASE'
    implementation group: 'org.hibernate', name: 'hibernate-entitymanager', version: '5.6.8.Final'
    implementation 'org.hibernate:hibernate-core:5.6.8.Final'

    implementation 'org.liquibase:liquibase-core:4.4.1'
    implementation 'org.springframework.kafka:spring-kafka:2.7.3'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'io.springfox:springfox-swagger2:3.0.0'
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.66.Final'

    implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1'
    implementation group: 'com.sun.jersey', name: 'jersey-client', version: '1.19.4'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-log4j', version: '1.2.5.RELEASE'
    implementation group: 'org.json', name: 'json', version: '20210307'
    implementation group: 'com.fasterxml.uuid', name: 'java-uuid-generator', version: '4.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.2.2'
    implementation 'commons-codec:commons-codec:1.9'
    implementation group: 'com.bazaarvoice.jolt', name: 'jolt-complete', version: '0.1.1'
    implementation group: 'com.google.zxing', name: 'core', version: '3.4.0'
    implementation group: 'com.google.zxing', name: 'javase', version: '3.4.0'

    implementation 'com.microsoft.azure:azure-storage:8.6.0'

    compileOnly 'org.projectlombok:lombok:1.18.20'
    runtimeOnly 'mysql:mysql-connector-java:8.0.25'
    runtimeOnly 'org.postgresql:postgresql:42.2.23'

    annotationProcessor 'org.projectlombok:lombok:1.18.20'

    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'com.azure:azure-messaging-eventhubs:5.10.1'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}

// ms-lib dependency
//dependencies {
//    implementation files('../ms-lib/build/libs/ms-lib-1.0.0.jar')
//}


test {
    useJUnitPlatform()
}

jar {
    enabled = true
}


